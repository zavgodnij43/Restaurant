<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ресторан - Головна</title>
    <!-- Підключення Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">🍽️ Ресторан</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'cart_detail' %}">Кошик</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'order_history' %}">Мої замовлення</a>
                    <a class="nav-link" href="{% url 'logout' %}">Вийти</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Увійти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Головний вміст -->
    <div class="container">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold text-dark">Ласкаво просимо до нашого ресторану!</h1>
                <p class="col-md-8 fs-4 text-muted">Найсмачніші страви, швидка доставка та найкращі ціни.</p>
                <a href="#" class="btn btn-primary btn-lg">Переглянути меню</a>
            </div>
        </div>
    </div>

    <!-- Підключення Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
