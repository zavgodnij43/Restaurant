<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - Ресторан</title>
    <!-- Підключення Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Вхід до ресторану</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Ім'я користувача</label>
                {{ form.username }}
                {{ form.username.errors }}
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                {{ form.password }}
                {{ form.password.errors }}
            </div>

            <button type="submit" class="btn btn-primary w-100">Увійти</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Ще не маєте акаунта? <a href="{% url 'register' %}">Зареєструватися</a></small>
        </div>
        <div class="text-center mt-2">
            <small><a href="{% url 'home' %}" class="text-decoration-none">← На головну</a></small>
        </div>
    </div>

    <!-- Підключення Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
